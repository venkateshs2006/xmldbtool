server:
  port: 8080

spring:
  application:
    name: xmldbtool

  # Java 21 Virtual Threads enabled for high-throughput concurrent I/O
  threads:
    virtual:
      enabled: true

  # Primary Datasource connected to local PostgreSQL database: v5_batch_db
  datasource:
    url: jdbc:postgresql://localhost:5432/v5_batch_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000

  # Spring Batch Configuration with v5_batch_db
  batch:
    jdbc:
      initialize-schema: never
      table-prefix: BATCH_
    job:
      enabled: false  

  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

# Management & Telemetry
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.bnpp: DEBUG
    org.springframework.batch: INFO
