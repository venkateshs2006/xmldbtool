<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XMLDbTool - Enterprise Ingestion Suite</title>
    <script>
        (function() {
            var token = sessionStorage.getItem('xmldb_auth_token');
            var userJson = sessionStorage.getItem('xmldb_user');
            if (!token || !userJson) {
                window.location.replace('login.html');
                return;
            }
            try {
                var user = JSON.parse(userJson);
                if (user.role === 'APPROVER') {
                    window.location.replace('joblist.html');
                } else {
                    window.location.replace('schedule.html');
                }
            } catch (e) {
                sessionStorage.clear();
                window.location.replace('login.html');
            }
        })();
    </script>
</head>
<body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #cbd5e1; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
        <h2 style="color: #ffffff; margin-bottom: 8px;">XML<span style="color: #00965e;">DbTool</span></h2>
        <p style="font-size: 13px; color: #94a3b8;">Redirecting to your enterprise workspace...</p>
    </div>
</body>
</html>
