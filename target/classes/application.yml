server:
  port: 8080

spring:
  application:
    name: xmldbtool

  # Primary Datasource for Spring Batch metadata (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/v5_batch_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
    # Batch Metadata Database Configuration (Primary)
    batchdb:
      url: jdbc:postgresql://localhost:5432/v5_batch_db
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2

  # Spring Batch Configuration
  batch:
    jdbc:
      initialize-schema: always
      schema: classpath:batch-schema.sql
      table-prefix: BATCH_
    job:
      enabled: false  

  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

# Management & Telemetry
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.enterprise.xmldbtool: DEBUG
    org.springframework.batch: INFO
