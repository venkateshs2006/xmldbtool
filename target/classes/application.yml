server:
  port: 8080

spring:
  application:
    name: xmldbtool

  # Primary Datasource for Spring Batch metadata (Embedded H2)
  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

  # Spring Batch initialization
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false # Do not auto-run batch jobs on startup

  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

# Management & Telemetry
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.enterprise.xmldbtool: DEBUG
    org.springframework.batch: INFO
